name: Release

on:
  push:
    tags: ['v*']
  # Manual runs must be dispatched on a tag ref (ref_name becomes the tag).
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Windows release
    runs-on: windows-latest
    # The payload includes CUDA PyTorch (~3 GB wheel) plus a full onedir
    # build, Volume split, installer build, and reassembly for verification.
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - uses: astral-sh/setup-uv@v5
        with:
          # Reuse the ~3 GB torch wheel between releases; keep the cache off
          # the runner's smaller system drive.
          enable-cache: true
          cache-local-path: D:\uv-cache

      - name: Install Python dependencies (CUDA torch via lockfile)
        run: uv sync --extra dev

      - name: Build release artifacts (volumes + Setup exe)
        # Includes verification: reassemble the Volumes into an Installation
        # and run the packaged-app smoke test before anything is uploaded.
        run: uv run python build/make_release.py --tag "${{ github.ref_name }}" --prune-onedir

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          # Setup exe + payload Volumes (release-manifest.json stays local)
          files: dist/release/EHT_Analytica-*
          body: |
            ## EHT Analytica ${{ github.ref_name }} — Windows

            | File | Notes |
            |------|-------|
            | `EHT_Analytica-Setup-*.exe` | **Download this.** Setup wizard (no admin rights needed) |
            | `EHT_Analytica-*-payload-*.zip` | Payload volumes — downloaded automatically by the Setup wizard |

            ### How to install

            1. Download `EHT_Analytica-Setup-*.exe` and run it.
            2. The wizard downloads the payload volumes automatically, verifies
               each one (SHA-256), and installs per-user with a desktop /
               Start-menu shortcut and an uninstall entry.

            ### Requirements

            - **Windows 10 x64 or newer**
            - About 8 GB free disk space during installation (the wizard
              downloads ~2.7 GB and assembles a ~5 GB Installation)
            - An NVIDIA GPU is optional: without one the app runs in CPU mode
              automatically. A recent NVIDIA driver enables GPU acceleration.

            The app is not code-signed — Windows SmartScreen may warn on first
            launch. Choose "More info" → "Run anyway".
