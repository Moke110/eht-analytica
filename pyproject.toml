[project]
name = "EHT_Analytica"
version = "0.2.0"
description = "A deep learning EHT contraction analysis tool"
authors = [{ name = "Chang Wang", email = "changwangbj02@gmail.com" }]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.0",
    "numpy",
    "pandas",
    "opencv-python",
    "torch>=2.0",
]

[project.optional-dependencies]
dev = ["pytest", "httpx", "pyinstaller>=6.0"]
desktop = ["pywebview>=5.0"]
training = [
    "jupyter>=1.0",
    "albumentations>=1.4",
    "scikit-image>=0.22",
    "matplotlib>=3.8",
    "tensorboard>=2.16",
    "scikit-learn>=1.4",
]

[tool.uv]
# PyTorch CUDA wheels for GPU support
extra-index-url = ["https://download.pytorch.org/whl/cu126"]
